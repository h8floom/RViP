schema: spec-driven

context: |
  Проект представляет собой Java Spring Boot REST-сервис
  для учета автомобилей в автоцентре.

  Предметная область ограничена одной таблицей автомобилей.

  Система должна поддерживать:
  - прием автомобилей;
  - просмотр автомобилей;
  - редактирование;
  - продажу;
  - удаление;
  - формирование отчета.

  API документируется через OpenAPI/Swagger.
  Структура базы данных управляется Liquibase.

rules:
  spec:
    - "Описывай наблюдаемое поведение системы, а не внутреннюю реализацию."
    - "Каждое требование должно содержать проверяемые сценарии."
    - "Используй формулировки SHALL/MUST для обязательного поведения."