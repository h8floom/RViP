spring:
  application:
    name: file-storage-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_DEFAULT_USER:lab5}
    password: ${RABBITMQ_DEFAULT_PASS:lab5-local}
    connection-timeout: 5s
    listener:
      simple:
        observation-enabled: true
        prefetch: 1

server:
  port: 8082

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:MinioLab4_2026}
  bucket: ${MINIO_BUCKET:car-reports}

eureka:
  client:
    enabled: false

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
