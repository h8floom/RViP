services:

  postgres:
    image: postgres:16
    container_name: car-center-postgres

    environment:
      POSTGRES_DB: car_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  app:
    build: .
    container_name: car-center-app

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - postgres

    restart: unless-stopped

volumes:
  postgres_data: