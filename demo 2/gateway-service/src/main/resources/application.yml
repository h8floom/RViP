spring:
  application:
    name: gateway-service
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          observability:
            enabled: true
          httpclient:
            pool:
              type: disabled
          routes:
            - id: cars-route
              uri: lb://car-center
              predicates:
                - Path=/api/cars,/api/cars/**
            - id: reports-route
              uri: lb://car-center
              predicates:
                - Path=/reports,/reports/**

server:
  port: 8088

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${random.value}"

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
