spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: car-service
              uri: http://app:8080
              predicates:
                - Path=/api/cars,/api/cars/**

            - id: report-service
              uri: http://report-service:8081
              predicates:
                - Path=/reports,/reports/**

server:
  port: 8088