spring:
  mvc:
    async:
      request-timeout: 20s
  application:
    name: car-center
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_DEFAULT_USER:lab5}
    password: ${RABBITMQ_DEFAULT_PASS:lab5-local}
    connection-timeout: 5s
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
      reply-timeout: 30s
  datasource:
    url: jdbc:postgresql://localhost:5433/car_center
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    enabled: false

report:
  service:
    url: http://localhost:8081

file:
  storage:
    service-url: http://localhost:8082

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
