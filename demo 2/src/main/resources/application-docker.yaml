spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/car_center
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  cloud:
    gateway:
      server:
        webflux:
          observability:
            enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html